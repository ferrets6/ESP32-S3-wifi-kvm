; PlatformIO project for ESP32-S3 Super Mini
; Composite USB HID (keyboard+mouse) via TinyUSB (arduino-esp32 native USB stack)
; + WiFi AP/STA + AsyncWebServer + WebSocket control UI
;
; Hardware detected on this machine (esptool flash_id):
;   Chip: ESP32-S3 (QFN56, rev v0.2)
;   Flash: 4MB (quad)
;   PSRAM: 2MB (quad)
;
; Two build environments:
;   esp32-s3-supermini         keyboard + mouse (normal desktop/app use)
;   esp32-s3-supermini-kbonly  keyboard only, no Report ID (see
;                              include/boot_keyboard.h) for BIOS/UEFI/GRUB
;                              boot-time compatibility. Flash this one to
;                              use the board before an OS is running; it has
;                              no mouse over USB.

[platformio]
; Without this, `pio run`/`pio run -t upload` with no -e builds (and would
; upload) BOTH environments, doubling build time and making an unqualified
; `pio run -t upload` flash whichever one SCons happens to finish last.
; kbonly is niche/explicit-use-only, so the default is the normal build;
; kbonly always requires spelling out -e esp32-s3-supermini-kbonly.
default_envs = esp32-s3-supermini

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Patches the installed arduino-esp32 core for esp32-s3-supermini-kbonly
; only (endpoint layout for BIOS/UEFI/GRUB boot-keyboard compatibility),
; and restores it to stock right after that build finishes; a no-op/self-
; heal check for every other environment. See tools/patch_framework.py and
; patches/framework/ for the full explanation -- the installed framework is
; never left modified once a build has completed.
extra_scripts = pre:tools/patch_framework.py

; --- Flash / PSRAM overrides for the actual 4MB flash / 2MB quad-PSRAM chip ---
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; --- USB mode: equivalent of Arduino IDE's ---
;   "USB Mode: USB-OTG (TinyUSB)"
;   "USB CDC On Boot: Disabled"  -> no separate CDC-ACM interfaces at all.
;                                   Necessary but NOT sufficient for BIOS/
;                                   GRUB compatibility on its own -- see the
;                                   esp32-s3-supermini-kbonly environment
;                                   below and include/boot_keyboard.h for the
;                                   rest of the story (Report IDs). Debug
;                                   logging now only happens over the network
;                                   (no Serial-over-USB); see /status.
;   "USB Firmware MSC On Boot: Disabled"
;   "USB DFU On Boot: Disabled"
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600
; Port is intentionally NOT pinned: this board exposes a different COM
; port depending on whether it's in bootloader mode (flashing) or running
; the app (CDC serial for Serial prints), and the number can also shift
; between reflashes. Let PlatformIO auto-detect it instead.

lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.7.0
    esp32async/AsyncTCP @ ^3.3.2
    ayushsharma82/ElegantOTA @ ^3.1.7

[env:esp32-s3-supermini]
; Default: keyboard + mouse composite, for normal desktop/app use. Both
; devices share ONE HID interface multiplexed by Report ID (1=keyboard,
; 2=mouse) -- that's how this core's USBHID class works whenever more than
; one HID device is registered, and it's the reason this build alone isn't
; reliably seen as a keyboard by BIOS/UEFI/GRUB (see boot_keyboard.h): boot
; keyboard reports must have NO Report ID byte at all.

[env:esp32-s3-supermini-kbonly]
build_flags =
    ${env.build_flags}
    -DKVM_KEYBOARD_ONLY=1
